<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>¿Quieres casarte conmigo?</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle, #ffe6eb 0%, #ffb3c6 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      padding: 20px;
    }

    .card {
      background: #ffffff;
      padding: 40px 30px;
      border-radius: 24px;
      box-shadow: 0 15px 35px rgba(255, 75, 110, 0.2);
      text-align: center;
      max-width: 420px;
      width: 100%;
      position: relative;
    }

    h1 {
      color: #d81159;
      font-size: 1.8rem;
      margin-bottom: 30px;
      line-height: 1.3;
    }

    .btn-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      min-height: 80px;
      position: relative;
    }

    button {
      padding: 14px 26px;
      font-size: 1.1rem;
      font-weight: 700;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
      transition: transform 0.15s ease;
      -webkit-tap-highlight-color: transparent;
    }

    #btn-si {
      background-color: #2ec4b6;
      color: #ffffff;
    }

    #btn-si:hover {
      transform: scale(1.08);
      background-color: #20a396;
    }

    #btn-no {
      background-color: #ff4d6d;
      color: #ffffff;
      transition: top 0.2s ease, left 0.2s ease;
    }

    .final-message {
      display: none;
      animation: fadeIn 0.6s ease forwards;
    }

    .final-message h2 {
      color: #d81159;
      font-size: 2rem;
      margin-bottom: 12px;
    }

    .final-message p {
      color: #555;
      font-size: 1.25rem;
      line-height: 1.4;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

  <div class="card" id="card">
    <div id="proposal-content">
      <h1 id="question">¿Lo Podemos Hacer Por Tu Culito? </h1>
      <div class="btn-container">
        <button id="btn-si">Si 😍</button>
        <button id="btn-no">NOO 💔</button>
      </div>
    </div>

    <div class="final-message" id="final-content">
      <h2>🎉 ¡Siii! 💖</h2>
      <p>Gracias, siempre supe que aceptarías, te amo.</p>
    </div>
  </div>

  <script>
    const btnNo = document.getElementById('btn-no');
    const btnSi = document.getElementById('btn-si');
    const proposalContent = document.getElementById('proposal-content');
    const finalContent = document.getElementById('final-content');

    function moverBoton() {
      // Dimensiones visibles de la pantalla y márgenes seguros
      const padding = 25;
      const btnWidth = btnNo.offsetWidth || 110;
      const btnHeight = btnNo.offsetHeight || 50;

      const maxX = window.innerWidth - btnWidth - padding;
      const maxY = window.innerHeight - btnHeight - padding;

      const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
      const randomY = Math.max(padding, Math.floor(Math.random() * maxY));

      btnNo.style.position = 'fixed';
      btnNo.style.left = `${randomX}px`;
      btnNo.style.top = `${randomY}px`;
      btnNo.style.zIndex = '9999';
    }

    // Eventos para computadora (mouse)
    btnNo.addEventListener('mouseenter', moverBoton);

    // Eventos para celular (pantalla táctil)
    btnNo.addEventListener('touchstart', (e) => {
      e.preventDefault();
      moverBoton();
    });

    // Acción al presionar "Si"
    btnSi.addEventListener('click', () => {
      btnNo.style.display = 'none';
      proposalContent.style.display = 'none';
      finalContent.style.display = 'block';
    });
  </script>
</body>
</html>
